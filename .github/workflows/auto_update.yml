name: Mise à jour automatique Veritass

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script de mise à jour
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python update_news.py

      - name: Pousser les nouvelles données
        run: |
          git config --global user.name "Veritass Bot"
          git config --global user.email "bot@veritass.fr"
          git add news_data.json
          git diff --staged --quiet || git commit -m "🔄 Mise à jour automatique $(date '+%d/%m/%Y %H:%M')"
          git push
